name: ✨ 功能建议
description: 想要新的接入方式、新的节点类型、新的观测视角
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前先想一句：**这个东西在运行期会不会引入不确定性？**
        本项目刻意把 LLM 关在「搭建阶段」里，运行期只有确定性引擎。碰到这条底线的建议，需要先说清怎么保持可重放。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 别从「我想要一个 X 功能」开始，从「我现在做不成什么」开始
      placeholder: 我们的接口需要先换 access_token 再调用，现在只能在每个节点前手写一个 HTTP 节点
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你想到的做法
      placeholder: 增加一种「凭证节点」，声明式取 token 并自动注入后续节点的 header
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现在是怎么绕过去的？为什么绕得难受？

  - type: dropdown
    id: area
    attributes:
      label: 涉及的模块
      multiple: true
      options:
        - 自然语言搭建 / 匹配
        - 流程执行引擎
        - 接口接入（OpenAPI / SDK / pip / 归档）
        - 帮助手册
        - 观测面板 / 前端
        - Chrome 插件
        - 认证与凭证
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 搜过现有 Issue 与 README 的「设计对齐说明」，没有重复
          required: true
        - label: 这个建议不会让运行期依赖 LLM 或外部随机源（或已说明如何保持确定性）
          required: true
