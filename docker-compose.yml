services:
  apiflow:
    build: .
    image: apiflow:0.5.0
    container_name: apiflow
    ports:
      - "3300:3300"
    volumes:
      # 流程定义 / 运行记录 / 接口目录 / LLM 设置（含 API Key）全在这里，升级镜像不丢
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      # 需要强制关闭 LLM 搭建（回归测试 / 纯规则模式）时打开：
      # - APIFLOW_LLM=off
    restart: unless-stopped
