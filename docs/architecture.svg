<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="APIFlow 架构图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .h1 { font-size: 21px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 13px; fill: #64748b; }
      .card-t { font-size: 14px; font-weight: 700; }
      .card-d { font-size: 11.5px; fill: #475569; }
      .chip { font-size: 11.5px; fill: #334155; }
      .tiny { font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <text class="t h1" x="40" y="42">APIFlow 架构：LLM 只参与搭建，运行期是纯确定性引擎</text>
  <text class="t sub" x="40" y="66">接口进来先被「归一化 + 指纹化」，流程跑起来只用冻结的 url 与 version —— 所以每次 run 都能重放、能 diff、能审计</text>

  <!-- A. 上游来源 -->
  <rect x="40" y="86" width="640" height="88" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text class="t card-t" x="56" y="110" fill="#3730a3">上游接口来源</text>
  <text class="t card-d" x="146" y="110">五条通道，进来后统一成一条 operation</text>
  <g>
    <rect x="56" y="122" width="112" height="34" rx="7" fill="#ffffff" stroke="#c7d2fe"/>
    <text class="t chip" x="112" y="144" text-anchor="middle">OpenAPI 文档</text>
    <rect x="179" y="122" width="112" height="34" rx="7" fill="#ffffff" stroke="#c7d2fe"/>
    <text class="t chip" x="235" y="144" text-anchor="middle">SDK 源码</text>
    <rect x="302" y="122" width="112" height="34" rx="7" fill="#ffffff" stroke="#c7d2fe"/>
    <text class="t chip" x="358" y="144" text-anchor="middle">pip 包</text>
    <rect x="425" y="122" width="112" height="34" rx="7" fill="#ffffff" stroke="#c7d2fe"/>
    <text class="t chip" x="481" y="144" text-anchor="middle">归档包 / 目录</text>
    <rect x="548" y="122" width="112" height="34" rx="7" fill="#ffffff" stroke="#c7d2fe"/>
    <text class="t chip" x="604" y="144" text-anchor="middle">帮助手册</text>
  </g>

  <line x1="360" y1="174" x2="360" y2="200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- B. 导入器 -->
  <rect x="40" y="204" width="640" height="76" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="t card-t" x="56" y="228" fill="#334155">导入器</text>
  <text class="t card-d" x="110" y="228">lib/openapi.js · sdk.js · pip.js · archive.js · docs.js</text>
  <text class="t card-d" x="56" y="250">解 $ref、拼 query、推 bodyExample、抽 JSDoc 符号、还原 PDF 中文、按标题切章节</text>
  <text class="t card-d" x="56" y="268">产出：method + path + 参数 + 示例 + <tspan font-weight="700" fill="#0f172a">specHash（内容指纹）</tspan></text>

  <line x1="360" y1="280" x2="360" y2="306" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- C. 注册表 -->
  <rect x="40" y="310" width="640" height="76" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
  <text class="t card-t" x="56" y="334" fill="#155e75">工具注册表 registry.js</text>
  <text class="t tiny" x="212" y="334">目录版本 v2026.10#rev</text>
  <text class="t card-d" x="56" y="356">ETag 轮询热更新（304 短路）· 发布时绑定接口版本与指纹</text>
  <text class="t card-d" x="56" y="374">版本变更 / 指纹漂移 → 扫描受影响流程 → 告警到观测面板</text>

  <line x1="360" y1="386" x2="360" y2="412" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- D. 搭建阶段 -->
  <rect x="40" y="416" width="640" height="130" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text class="t card-t" x="56" y="440" fill="#9a3412">搭建阶段 —— 唯一允许 LLM 的地方</text>
  <rect x="56" y="452" width="292" height="78" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text class="t card-d" x="70" y="474" font-weight="700" fill="#7c2d12">agent.js + match.js</text>
  <text class="t card-d" x="70" y="494">自然语言 → 意图切分 → 接口匹配</text>
  <text class="t card-d" x="70" y="512">手册兜底：接口名没写全时按文档对上</text>
  <rect x="364" y="452" width="300" height="78" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text class="t card-d" x="378" y="474" font-weight="700" fill="#7c2d12">三道闸（缺一不可）</text>
  <text class="t card-d" x="378" y="494">① Schema 校验 → ② Dry-run（写操作打桩）</text>
  <text class="t card-d" x="378" y="512">③ 人工在画布上确认后才允许发布</text>

  <line x1="360" y1="546" x2="360" y2="572" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- E. DSL -->
  <rect x="40" y="576" width="640" height="66" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text class="t card-t" x="56" y="600" fill="#5b21b6">流程 DSL —— 唯一契约</text>
  <text class="t card-d" x="56" y="622">version 版本化 · input 参数化 · 幂等键 · 重试退避 · trigger · layout</text>

  <line x1="360" y1="642" x2="360" y2="668" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- F. 引擎 -->
  <rect x="40" y="672" width="640" height="76" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text class="t card-t" x="56" y="696" fill="#065f46">运行引擎 engine.js（零 LLM、零随机）</text>
  <text class="t card-d" x="56" y="718">触发器 手动 / Webhook / 定时 → 调度器 拓扑推进 · 分支并发 · 条件状态机</text>
  <text class="t card-d" x="56" y="736">→ 执行器 HTTP / 条件 / 转换 / 循环：重试退避 · 超时 · 幂等 · 从任意节点重放</text>

  <!-- 右列：确定性边界 -->
  <rect x="720" y="86" width="440" height="170" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-dasharray="5 4"/>
  <text class="t card-t" x="738" y="112" fill="#0f172a">确定性边界</text>
  <text class="t card-d" x="738" y="138">运行期只用发布时冻结的 url + apiVersion，</text>
  <text class="t card-d" x="738" y="158">接口升级不会悄悄改变已有流程的行为。</text>
  <text class="t card-d" x="738" y="186">LLM 只出现在搭建阶段；运行期没有模型、</text>
  <text class="t card-d" x="738" y="206">没有随机源、没有隐式重试。</text>
  <text class="t card-d" x="738" y="234" font-weight="700" fill="#0f172a">代价：可重放 · 可 diff · 可审计 · 零 token。</text>

  <!-- 插件 -->
  <rect x="720" y="310" width="440" height="76" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="t card-t" x="738" y="334" fill="#1e40af">Chrome MV3 侧边栏插件</text>
  <text class="t card-d" x="738" y="356">与 Web 端共用同一套目录与引擎，只是换了个入口：</text>
  <text class="t card-d" x="738" y="374">自然语言下发 → 实时执行轨迹 → token / AK-SK 两种认证</text>
  <line x1="718" y1="348" x2="686" y2="348" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 观测 -->
  <rect x="720" y="416" width="440" height="130" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="t card-t" x="738" y="440" fill="#1e40af">观测面板（SSE 事件流）</text>
  <text class="t card-d" x="738" y="462">节点四色状态 · 边数据流动画 · 点击 chip 看字段级来源溯源</text>
  <text class="t card-d" x="738" y="482">run_start / node_start / node_end / node_retry / edge_data / run_end</text>
  <text class="t card-d" x="738" y="504">两次 run 逐节点 diff → 定位「哪一步变了」</text>
  <text class="t card-d" x="738" y="526">节点详情抽屉：请求 / 响应 / 重试记录 / 从此节点重放</text>
  <line x1="718" y1="480" x2="686" y2="480" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 存储 -->
  <rect x="720" y="672" width="440" height="76" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="t card-t" x="738" y="696" fill="#334155">存储层 store.js</text>
  <text class="t card-d" x="738" y="718">JSON 文件：flows / runs（保留 500 条）/ alerts / sources / creds</text>
  <text class="t card-d" x="738" y="736">换 PostgreSQL 只需替换这一个模块</text>
  <line x1="718" y1="710" x2="686" y2="710" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
